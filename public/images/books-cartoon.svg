<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="title desc">
  <title id="title">Stack of books with graduation cap</title>
  <desc id="desc">Three realistic books stacked beneath a graduation cap.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d6298"/>
      <stop offset="1" stop-color="#172c55"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a8dc"/>
      <stop offset="1" stop-color="#21699d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4cf70"/>
      <stop offset="1" stop-color="#c18132"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7d9"/>
      <stop offset="1" stop-color="#d9b86f"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#17294e" flood-opacity=".25"/>
    </filter>
  </defs>

  <ellipse cx="320" cy="492" rx="230" ry="22" fill="#233862" opacity=".2"/>

  <!-- Bottom book: navy cover, cream pages, rounded spine -->
  <g stroke="#13284e" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" filter="url(#softShadow)">
    <path fill="url(#navy)" d="M90 393c0-7 6-13 13-13h405l49 22-55 75-400-25c-7 0-12-6-12-13z"/>
    <path fill="url(#pages)" d="m139 380 418 22-55 61-405-25z"/>
    <path fill="none" stroke="#c3a66b" stroke-width="4" d="m168 397 363 20M164 409l354 20M158 421l345 20M154 434l330 20"/>
    <path fill="none" stroke="#87acd9" stroke-width="8" d="M112 395v62M139 388v62"/>
  </g>

  <!-- Middle book: warm gold cover, cream pages, red bookmark -->
  <g stroke="#13284e" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" filter="url(#softShadow)">
    <path fill="url(#gold)" d="M74 310c0-7 6-13 13-13h409l51 22-55 74-407-24c-7 0-12-6-12-13z"/>
    <path fill="url(#pages)" d="m138 297 409 22-55 62-408-24z"/>
    <path fill="none" stroke="#c3a66b" stroke-width="4" d="m170 314 355 19M166 326l346 19M159 339l337 19M154 351l326 19"/>
    <path fill="none" stroke="#ffe9a0" stroke-width="8" d="M102 316v61M128 307v62"/>
    <path fill="#da4749" d="m257 305 43 3-4 82-31-24-35 17z"/>
  </g>

  <!-- Top book: blue cover, cream pages, rounded spine -->
  <g stroke="#13284e" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" filter="url(#softShadow)">
    <path fill="url(#blue)" d="M103 229c0-7 6-13 13-13h393l50 22-55 73-391-24c-7 0-12-6-12-13z"/>
    <path fill="url(#pages)" d="m153 216 406 22-55 61-395-24z"/>
    <path fill="none" stroke="#c3a66b" stroke-width="4" d="m183 233 352 19M179 245l343 19M172 258l335 19M168 270l320 19"/>
    <path fill="none" stroke="#a9d8f0" stroke-width="8" d="M139 232v60M166 222v61"/>
  </g>

  <!-- Graduation cap clearly resting above the top book -->
  <g stroke="#13284e" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" filter="url(#softShadow)">
    <path fill="#293448" d="m176 173 145-63 143 66-145 65z"/>
    <path fill="#192337" d="M238 177v66c0 29 36 48 83 48s84-19 84-48v-66l-84 38z"/>
    <path fill="none" stroke="#63738d" stroke-width="5" d="m203 173 118-51 116 54M251 185l-2 51M390 185l2 49"/>
    <path fill="none" stroke="#dda033" stroke-width="6" d="M321 122V91c0-17 23-23 48-12 28 12 47 29 47 50v36"/>
    <circle cx="416" cy="165" r="13" fill="#f2b82f" stroke-width="6"/>
    <path fill="#f2b82f" stroke-width="6" d="M416 178c-3 20-13 34-23 47 14-4 21-1 24 9 4-10 11-13 24-9-11-14-20-27-25-47z"/>
  </g>
</svg>